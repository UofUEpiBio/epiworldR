    <text
       x="-1501.7428"
       y="656.47144"
       id="text60-2"
       style="font-size:13px;white-space:pre;inline-size:312.046;display:inline;fill:#333333"
       transform="translate(726.85714,-445.71429)"
       xml:space="preserve"><tspan
         x="-1501.7428"
         y="656.47144"
         id="tspan4"><tspan
   style="font-weight:600"
   id="tspan3">Household-based strategy.</tspan> Two whole households </tspan><tspan
         x="-1501.7428"
         y="672.72144"
         id="tspan5">agree to bubble together, so the tie between them </tspan><tspan
         x="-1501.7428"
         y="688.97144"
         id="tspan6">stays active.</tspan></text>
  </g>
  <g
     id="g80"
     transform="translate(1255.8036,-130.62453)">
    <circle
       cx="-796.24432"
       cy="279.58096"
       r="10.5"
       fill="#ffffff"
       stroke="#333333"
       stroke-width="1.8"
       id="circle60-1"
       style="font-size:13px" />
    <text
       x="-796.24432"
       y="284.08096"
       text-anchor="middle"
       font-size="11.5px"
       font-weight="700"
       fill="#111111"
       id="text61-5">2</text>
    <text
       x="-1572.6"
       y="891.90002"
       id="text62-2"
       style="font-size:13px;white-space:pre;inline-size:305.319;display:inline;fill:#333333"
       transform="translate(796.35563,-611.81905)"
       xml:space="preserve"><tspan
         x="-1572.6"
         y="891.90002"
         id="tspan8"><tspan
   style="font-weight:600"
   id="tspan7">Individual-based strategy.</tspan> One person picks a </tspan><tspan
         x="-1572.6"
         y="908.15003"
         id="tspan9">single peer outside their household; because that </tspan><tspan
         x="-1572.6"
         y="924.40003"
         id="tspan10">choice commits the whole household, both </tspan><tspan
         x="-1572.6"
         y="940.65003"
         id="tspan11">households merge. Several members choosing can </tspan><tspan
         x="-1572.6"
         y="956.90003"
         id="tspan12">pull in further households, so these bubbles may </tspan><tspan
         x="-1572.6"
         y="973.15003"
         id="tspan13">grow larger than a pair.</tspan></text>
  </g>

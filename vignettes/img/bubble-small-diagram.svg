  <title
     id="title1">Social bubbles in a network-based agent-based model</title>
  <desc
     id="desc1">Five households connected by single bridging ties. Under the bubble
        intervention, households are grouped into three bubbles; ties that cross
        a bubble boundary are switched off.</desc>

       id="text65-8"
       style="font-size:13px;white-space:pre;inline-size:317.295;display:inline;fill:#333333"
       transform="translate(726.85714,-397.71429)"
       xml:space="preserve"><tspan
         x="-1503.1014"
         y="804.67053"
         id="tspan15"><tspan
   style="font-weight:600"
   id="tspan14">No partner left.</tspan> A household whose contacts were </tspan><tspan
         x="-1503.1014"
         y="820.92054"
         id="tspan16">already taken stays on its own — a strict household-</tspan><tspan
         x="-1503.1014"
         y="837.17054"
         id="tspan17">only lockdown.</tspan></text>
  </g>
